reca_ahorro:
  obtenerRecaByProductoId: "select reca from reca_ahorro ra where ra.tipo_ahorro_id = :productoId;"
  
cat_relacion:
  obtenerParentescoById: "select descripcion as parentesco from cat_relacion where id = :id;"

ahorro_contrato:
  obtenerDatosCuentaReporteEdoMovPROCREA: "select ac.cuenta, ac.cuenta_clabe, ac.solicitante_id, ta.tipo_ahorro_id, ta.descripcion
                                           from ahorro_contrato ac
                                           join tipos_ahorro ta on ac.tipo_ahorro_id = ta.tipo_ahorro_id
                                           where ac.cuenta = :cuenta;"

conceptos_solicitantes:  
  obtenerConceptoColonia: "select valor from public.conceptos_solicitantes cs where cs.id_solicitante  = :id_solicitante
                          and cat_conceptos_id = (select id from cat_conceptos where clave = 'SOLIC_COLONIA') limit 1;"

reportes_param:
  obtenerDatosReportesParamByLLave: "select llave, parametro1, parametro2, parametro3, parametro4, parametro5, parametro6, parametro7,
                                     parametro8, parametro9, parametro10, parametro11, parametro12, parametro13, parametro14, parametro52, parametro53 
                                     from reportes_param 
                                     where llave = :llave;"