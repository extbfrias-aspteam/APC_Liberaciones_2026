inversiones:
  existeInversionByCuenta: "SELECT EXISTS (SELECT arv.rendimiento_vigente_id 
                            FROM ahorro_rendimiento_vigente arv 
                            JOIN ahorro_contrato ac ON ac.cuenta = arv.cuenta
                            LEFT JOIN (SELECT ac2.ahorro_contrato_id, ac2.valor
                            FROM ahorro_conceptos ac2
                            JOIN cat_conceptos cc2 ON ac2.cat_conceptos_id = cc2.id
                            WHERE cc2.clave = 'NOM_INVERSION') 
                            acc ON acc.ahorro_contrato_id = ac.ahorro_contrato_id
                            LEFT JOIN ahorro_no_reinvertir anr ON ac.cuenta = anr.cuenta
                            WHERE arv.estatus = 'A'
                            AND ac.tipo_ahorro_id = 1
                            AND ac.cuenta = :cuenta);"

  validaExisteInformacionEdoCuenta: "SELECT DISTINCT
                                         ai.cuenta
                                       FROM public.ahorro_imprime_edocuenta ai
                                       LEFT JOIN public.ahorro_imprime_edocuenta_detalle det
                                       ON ai.cuenta = det.cuenta
                                       AND ai.mes = det.mes
                                       AND ai.anio = det.anio
                                       WHERE ai.cuenta IN (
                                       SELECT ac.cuenta
                                       FROM ahorro_rendimiento_vigente arv
                                       JOIN ahorro_contrato ac
                                       ON ac.cuenta = arv.cuenta
                                       LEFT JOIN (
                                       SELECT
                                         ac2.ahorro_contrato_id,
                                         ac2.valor
                                       FROM ahorro_conceptos ac2
                                       JOIN cat_conceptos cc2
                                       ON ac2.cat_conceptos_id = cc2.id
                                       WHERE cc2.clave = 'NOM_INVERSION') acc
                                       ON acc.ahorro_contrato_id = ac.ahorro_contrato_id
                                       LEFT JOIN ahorro_no_reinvertir anr
                                       ON ac.cuenta = anr.cuenta
                                       WHERE arv.estatus = 'A'
                                       AND ac.tipo_ahorro_id = 1)
                                       AND ai.anio = :anio
                                       AND ai.mes = :mes
                                       and ai.cuenta =:cuenta
                                       ORDER BY ai.cuenta ASC;"