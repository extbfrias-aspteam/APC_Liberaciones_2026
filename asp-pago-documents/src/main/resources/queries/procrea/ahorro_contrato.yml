ahorro_contrato:
  obtenerAhorroContratoByCuenta: "select
                                  c.solicitante_id, c.cuenta, c.cuenta_clabe, c.contrato, c.tipo_ahorro_id,
                                  c.sucursal_apertura, c.estatus, c.referencia, c.cuenta_padre,
                                  coalesce(s.rfc1 || s.rfc2 || s.rfc3) as rfc, s.curp, s.nombre,
                                  coalesce(t.telefono, '') as telefono_codi, s.correo
                                  from ahorro_contrato c
                                  join solicitante s on s.numero = c.solicitante_id
                                  join directorio_telefonico t on t.id_solicitante = s.numero and t.id_cat_telefono = 7
                                  where c.cuenta = :cuenta;"