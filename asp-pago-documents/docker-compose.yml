networks:
  asp-pago-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/27

services:
  asp-pago-onb:
    image: asp-pago-onb:latest
    container_name: asp-pago-onb
    user: "${UID}:${GID}"
    restart: always
    env_file:
      - .env
      - ${HOST_CONTAINER}/asp-pago-onb/.env.onb
    environment:
      - TZ=${TZ}
    ports:
      - "8014:8014"
    networks:
      - asp-pago-network
    volumes:
      - ${HOST_CONTAINER}/asp-pago-onb/config/:/app/config/
      - ${HOST_CONTAINER}/asp-pago-onb/logs/:/app/logs/
    extra_hosts:
      sr-mule-sti.integraopciones.mx: ${MULE_STI_IP}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "256M"

  asp-pago-access:
    image: asp-pago-access:latest
    container_name: asp-pago-access
    #user: "${UID}:${GID}"
    restart: always
    env_file:
      - .env
      - ${HOST_CONTAINER}/asp-pago-access/.env.access
    environment:
      - TZ=${TZ}
    ports:
      - "8015:8015"
    networks:
      - asp-pago-network
    volumes:
      - ${HOST_CONTAINER}/asp-pago-access/config/:/app/config/
      - ${HOST_CONTAINER}/asp-pago-access/logs/:/app/logs/
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.2"
          memory: "320M"

  asp-pago-management:
    image: asp-pago-management:latest
    container_name: asp-pago-management
    user: "${UID}:${GID}"
    restart: always
    env_file:
      - .env
      - ${HOST_CONTAINER}/asp-pago-management/.env.management
    environment:
      - TZ=${TZ}
    ports:
      - "8016:8016"
    networks:
      - asp-pago-network
    volumes:
      - ${HOST_CONTAINER}/asp-pago-management/config/:/app/config/
      - ${HOST_CONTAINER}/asp-pago-management/logs/:/app/logs/
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.1"
          memory: "256M"

  asp-pago-payments:
    image: asp-pago-payments:latest
    container_name: asp-pago-payments
    user: "${UID}:${GID}"
    restart: always
    env_file:
      - .env
      - ${HOST_CONTAINER}/asp-pago-payments/.env.payments
    environment:
      - TZ=${TZ}
    ports:
      - "8017:8017"
    networks:
      - asp-pago-network
    volumes:
      - ${HOST_CONTAINER}/asp-pago-payments/config/:/app/config/
      - ${HOST_CONTAINER}/asp-pago-payments/logs/:/app/logs/
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.2"
