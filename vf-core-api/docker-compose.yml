services:
  vf-core-api:
    image: vf-core-api:latest
    container_name: vf-core-api
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    ports:
      - "8031:8031"
    volumes:
      - ${HOST_CONTAINER}/config/:/app/config/
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.2"
          memory: "320M"