registro_codi:
  obtenerRegistroCoDiByCuentaAh: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                  coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                  coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales
                                  from codi.registro_codi rc 
                                  join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                  where rc.cuenta = :cuentaah and rc.activo = true;"

  obtenerRegistroCoDiByPersonaId: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                   coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                   coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales
                                   from codi.registro_codi rc 
                                   join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                   where rc.solicitante_id = :personaId and rc.activo = true and rc.principal = true;"

  consultarRegistroCoDiCliente: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                 coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                 coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales, rc.principal
                                 from codi.registro_codi rc 
                                 join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                 where rc.solicitante_id = :personaId and rc.activo = true and rsd.registro_nueva_app = '2';"

operaciones_ejecutadas:
  buscaOperacionEjecutadaPendiente: "select ope.id, ope.fecha_creacion from codi.operaciones_ejecutadas ope 
                                     where ope.cuenta = :cuentaah and ope.completada = 0
                                     order by ope.fecha_creacion desc limit 1;"

  registraOperacionEjecutada: "insert into codi.operaciones_ejecutadas(id, cuenta, id_operacion, id_cat_operacion_ejecutada, completada, fecha_creacion) 
                               values (:id, :cuenta, :id_operacion, :id_cat_operacion_ejecutada, :completada, now()) returning id;"

  finalizaOperacionEjecutada: "update codi.operaciones_ejecutadas 
                               set completada = 1, fecha_modificacion = now()
                               where id = :id;"

  finalizaOperacionEjecutadaWithObs: "update codi.operaciones_ejecutadas 
                                      set completada = 1, observacion = :observacion, fecha_modificacion = now()
                                      where id = :id;"

bitacora_procesamiento:
  nuevoBitPro: "insert into codi.bitacora_procesamiento(id, cuenta, operacion_id, fecha_inicio, fecha_fin, id_procesamiento) 
				values (:id, :cuenta, :operacion_id, :fhInicio, :fhFin, :idProcesamiento);"

  sigSecProId: "select nextval('codi.bitacora_procesamiento_id_procesamiento_seq'::regclass);"

  sigSecBitPro: "select nextval('codi.bitacora_procesamiento_id_seq'::regclass);"

secuencias:
  sigSecOperacionEjecutada: "select nextval('codi.operaciones_ejecutadas_id_seq'::regclass);"

listanegra_asppago:
  estaEnListaNegra: "SELECT 1 FROM codi.listanegra_asppago lng WHERE lng.valor = :valor"

movimientos_asppago_sospechosos:
  registraMovimientoSospechoso: "INSERT INTO codi.movimientos_asppago_sospechosos
								(cta_ahorro, cta_ordenante, cta_beneficiaria, id_banco_ben, monto, refnum, concepto,
								nombre_ordenante, nombre_beneficiario, observaciones)
								VALUES (:ctaAhorro, :ctaOrdenante, :ctaBeneficiaria, :idBancoBeneficiario, :monto, :refNumerica, :concepto, :nombreOrdenante, :nombreBeneficiario, :observaciones)
								RETURNING id;"

favoritos_transferencias:
  obtenerFavoritoCuentaByCuentaBeneficiario: "select id, numero_cuenta_codi, nombre_beneficiario, numero_cuenta_beneficiario, id_tipo_cuenta_beneficiario, 
                                              id_institucion_beneficiario, nombre_institucion, alias, fecha_creacion
                                              from codi.favoritos_transferencias 
                                              where numero_cuenta_codi = :numero_cuenta_codi 
                                              and numero_cuenta_beneficiario = :numero_cuenta_beneficiario 
                                              and id_estatus = 1;"

  esFavoritoConTiempoValido: "select exists (
                                  select 1
                                  from codi.favoritos_transferencias
                                  where id = :idFavorito
                                    and id_estatus = 1
                                    and fecha_creacion <= now() - (:minutos || ' minutes')::interval
                              ) as valido;"