movimientos_caja:
  registraMovimientoCaja: "insert into movimientos_caja(
                           movimiento_id, caja_id, cajero_id, fecha, tipo_mov_id, moneda_id, monto, tipo_cambio, 
                           forma_pago, cuenta, control, banco_id, cheque, estatus, obs, poliza, 
                           referencia_movimiento_id, banco_origen, fecha_deposito, poliza_provision, 
                           transaccion_id, tarjeta_operativa_id, region_id, id_importacion, moneda_valor, 
                           moneda_nombre, moneda_fecha_valor, monto_original, monto_destino, moneda_error, 
                           creado_por, modificado_por, fecha_creacion, fecha_modificacion) 
                           values(
                           :movimiento_id, :caja_id, :cajero_id, :fecha, :tipo_mov_id, :moneda_id, :monto, :tipo_cambio, 
                           :forma_pago, :cuenta, :control, :banco_id, :cheque, :estatus, :obs, :poliza, 
                           :referencia_movimiento_id, :banco_origen, :fecha_deposito, :poliza_provision, 
                           :transaccion_id, :tarjeta_operativa_id, :region_id, :id_importacion, :moneda_valor, 
                           :moneda_nombre, :moneda_fecha_valor, :monto_original, :monto_destino, :moneda_error, 
                           :creado_por, :modificado_por, now(), now());"

  obtenerAhorroMovimientoById: "select movimiento_id, descripcion, operacion, salvo_buen_cobro, cuenta_contable, provisionar, manual, 
                                creado_por, fecha_creacion, modificado_por, fecha_modificacion 
                                from ahorro_movimientos where movimiento_id = :movimiento_id;"

  registraGeolocalizacionMovimientoCaja: "insert into geolocalizacion_movimiento_caja 
                                          (movimiento_id, coordenadas, usuario_creacion, fecha_creacion) 
                                          values (:movimiento_id, point(:latitud, :longitud), :usuario_creacion, now());"

ahorro_disposiciones:
  registraAhorroDisposicion: "insert into ahorro_disposiciones 
                              (id, cuenta, fecha, monto, forma_pago_id, banco_id, cheque, movimiento_id, creado_por, fecha_creacion, transaccion_id, 
                              tarjeta_operativa_id, app, transaccion_version_id, aviso_id)
					          values (:id, :cuenta, :fecha, :monto, :forma_pago_id, :banco_id, :cheque, :movimiento_id, :creado_por, now(), :transaccion_id, 
                              :tarjeta_operativa_id, :app, :transaccion_version_id, :aviso_id);"
ahorro_saldos:
  obtenerAhorroSaldoByCuentaAh: "select cuenta, solicitante_id, saldo_real, saldo_promedio, saldo_acumulado, fecha_corte, fecha_deposito, intereses, iva,
                                 isr, retenciones, desviacion, dias, saldo_disponible, ahorro_saldos_id, ide 
			                     from ahorro_saldos where cuenta = :cuentaah;"

  registraAhorroSaldos: "insert into ahorro_saldos 
                         (cuenta, solicitante_id, saldo_real, saldo_promedio, saldo_acumulado, fecha_corte, fecha_deposito, 
                         intereses, iva, isr, retenciones, desviacion, dias, saldo_disponible, ahorro_saldos_id, ide) 
                         values (:cuenta, :solicitante_id, :saldo_real, :saldo_promedio, :saldo_acumulado, :fecha_corte, :fecha_deposito, 
                         :intereses, :iva, :isr, :retenciones, :desviacion, :dias, :saldo_disponible, :ahorro_saldos_id, :ide);"

  actualizaAhorroSaldos: "update ahorro_saldos set saldo_real = :saldo_real, saldo_acumulado = :saldo_acumulado, saldo_disponible = :saldo_disponible
                          where ahorro_saldos_id = :ahorro_saldos_id;"

ahorro_transferencias:
  registraAhorroTransaferencia: "insert into ahorro_transferencias 
                                 (id, cuenta_ori, cuenta_des, fecha, monto, movimiento_id, creado_por, deposito_id, disposicion_id, fecha_creacion)
                                 values (:id, :cuenta_ori, :cuenta_des, :fecha, :monto, :movimiento_id, :creado_por, :deposito_id, :disposicion_id, now());"

secuencias:
  sigSecMovimientosCaja: "select nextval('movimientos_caja_seq');"

  sigSecAhorroDisposicion: "select nextval('ahorro_disposiciones_id_seq'::regclass);"

  sigSecAhorroSaldos: "select nextval('ahorro_saldos_ahorro_saldos_id_seq');"

  sigSecAhorroTransferencias: "select nextval('ahorro_transferencias_id_seq'::regclass);"