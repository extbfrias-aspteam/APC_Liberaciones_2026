spring.cero.datasource.hikari.jdbc-url=${DB_CERO_HOST}?currentSchema=public&ApplicationName=asp-pago-access
spring.cero.datasource.hikari.username=${DB_CERO_USER}
spring.cero.datasource.hikari.password=${DB_CERO_PASS}
spring.cero.datasource.hikari.driver-class-name=org.postgresql.Driver
spring.cero.datasource.hikari.sql-script-encoding=UTF-8

spring.cero.datasource.hikari.pool-name=CeroPool
spring.cero.datasource.hikari.maximum-pool-size=5
spring.cero.datasource.hikari.connection-timeout=300000
spring.cero.datasource.hikari.minimum-idle=2
spring.cero.datasource.hikari.max-lifetime=120000

