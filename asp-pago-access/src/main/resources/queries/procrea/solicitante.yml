solicitante:
  obtenerDatosBasicosById: "select s.numero, s.nombre, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, dt.telefono
                            from solicitante s 
                            join directorio_telefonico dt on dt.id_solicitante = s.numero
                            where s.numero = :numero and dt.id_cat_telefono = 7;"

  obtenerDatosBasicosByTelefonoCoDi: "select s.numero, s.nombre, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, dt.telefono
                                      from solicitante s 
                                      join directorio_telefonico dt on dt.id_solicitante = s.numero
                                      where dt.telefono = :telefonoCoDi and dt.id_cat_telefono = 7;"

  obtenerDatosGeneralesById: "select s.numero, s.nombre, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, dt.telefono, s.domicilio,
                              s.colonia, s.celular, coalesce(s.cat_domicilio1, 0) as cat_domicilio1, coalesce(s.cat_domicilio2, 0) as cat_domicilio2,
                              coalesce(s.cat_domicilio3, 0) as cat_domicilio3, coalesce(s.cat_domicilio4, 0) as cat_domicilio4, coalesce(s.cat_domicilio5, 0) as cat_domicilio5,
                              coalesce(s.descripcion_domicilio1, '') as descripcion_domicilio1, coalesce(s.descripcion_domicilio2, '') as descripcion_domicilio2, 
                              coalesce(s.descripcion_domicilio3, '') as descripcion_domicilio3, coalesce(s.descripcion_domicilio4, '') as descripcion_domicilio4,
                              coalesce(s.descripcion_domicilio5, '') as descripcion_domicilio5, coalesce(s.domicilo_observaciones, '') as domicilo_observaciones,
                              s.rfc1, s.rfc2, s.rfc3, s.sexo, s.t_persona, s.numero_casa
                              from solicitante s 
                              join directorio_telefonico dt on dt.id_solicitante = s.numero
                              where s.numero = :numero and dt.id_cat_telefono = 7;"

  registrarBitacoraCambio: "insert into bit_autoriza (control, tipo, usuario_aut, fecha_mov, fecha_creacion, actual, nuevo, observaciones)
                            values(:control, :tipo, :usuario_aut, now(), now(), :actual, :nuevo, :obs);"

conceptos_solicitantes:
  obtenerConceptoSolicitanteByClave: "select valor from conceptos_solicitantes cs 
                                      where cs.cat_conceptos_id = (select cc.id from cat_conceptos cc where cc.clave = :claveConcepto) 
                                      and cs.id_solicitante = :personaId;"
