ahorro_conceptos:
  obtenerConceptoCuentaByClave: "select aco.id, aco.valor from ahorro_contrato ac
                                 join ahorro_conceptos aco on aco.ahorro_contrato_id = ac.ahorro_contrato_id 
                                 join cat_conceptos cc on cc.id = aco.cat_conceptos_id 
                                 where ac.solicitante_id = :personaId and ac.cuenta = :cuentaah and cc.clave = :clave;"

  obtenerConceptoCuentaProcreaByPersonaId: "select aco.id, aco.valor from ahorro_contrato ac
                                            join ahorro_conceptos aco on aco.ahorro_contrato_id = ac.ahorro_contrato_id 
                                            join cat_conceptos cc on cc.id = aco.cat_conceptos_id 
                                            where ac.solicitante_id = :personaId and cc.clave = :clave;"

  actualizarValorConceptoCuentaById: "update ahorro_conceptos set valor = :valor where id = :id;"

  actualizarValorConceptoCuentaProcreaByPersonaId: "UPDATE ahorro_conceptos aco
                                                    SET valor = :valor
                                                    WHERE EXISTS (
                                                        SELECT 1
                                                        FROM ahorro_contrato ac
                                                        JOIN cat_conceptos cc ON cc.id = aco.cat_conceptos_id
                                                        WHERE ac.ahorro_contrato_id = aco.ahorro_contrato_id
                                                        AND ac.solicitante_id = :personaId AND cc.clave = :clave
                                                    );"