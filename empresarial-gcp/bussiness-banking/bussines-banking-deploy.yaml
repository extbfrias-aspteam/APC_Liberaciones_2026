apiVersion: apps/v1
kind: Deployment
metadata:
  name: bussiness
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bussiness
  template:
    metadata:
      labels:
        app: bussiness
    spec:
      containers:
      - name: bussiness
        image: northamerica-south1-docker.pkg.dev/prj-hypertech-prod/docker-repo-asp-prod/bussiness-banking:prod
        imagePullPolicy: Always
        envFrom:
          - configMapRef:
              name: banking-business-config
          - secretRef:
              name: banking-business-secret
        env:
          - name: TZ
            value: "America/Mexico_City"
          - name: JAVA_TOOL_OPTIONS
            value: "-Duser.timezone=America/Mexico_City"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

