apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-frontend
  namespace: apps
  labels:
    app: angular-frontend
    app.kubernetes.io/name: angular-frontend
    app.kubernetes.io/instance: empresarial
    app.kubernetes.io/version: "1.30.4"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: angular-frontend
  template:
    metadata:
      labels:
        app: angular-frontend
        app.kubernetes.io/name: angular-frontend
        app.kubernetes.io/instance: empresarial
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: northamerica-south1-docker.pkg.dev/prj-hypertech-prod/docker-repo-asp-prod/html-empresarial:prod
        imagePullPolicy: Always
        env:
            - name: TZ
              value: "America/Mexico_City"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 64Mi
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
          failureThreshold: 30
          timeoutSeconds: 1
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 1
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "nginx -s quit; while kill -0 1 2>/dev/null; do sleep 1; done"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi

