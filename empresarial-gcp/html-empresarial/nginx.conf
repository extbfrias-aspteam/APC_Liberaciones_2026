# Map para definir qué rutas son públicas (Bypass)
map $uri $is_public {
    default 0;
    "~*(index\.html|/|login|home)$" 1;
}

# Combinamos: si NO es pública (0) y NO hay cookie (:), bloqueamos
map "$is_public:$cookie_access_token" $should_block {
    "0:" 1;
    default 0;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  autoindex off;
  merge_slashes on;
  ignore_invalid_headers on;

  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  keepalive_requests 500;
  client_max_body_size 2m;
  large_client_header_buffers 4 8k;
  
  error_page 404 /__errors/404.html;
  
  location = /__errors/404.html {
    internal;
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-store" always;
    try_files /__errors/404.html =404;
  }   

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  
  absolute_redirect off;
  port_in_redirect off;

  location = / {
    return 302 /business_banking/index.html;
  }

  location ~* \\.(?:js|css|png|jpg|jpeg|svg|ico|woff|woff2)$ {
    include /etc/nginx/snippets/security_headers.conf;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, no-transform" always;
    try_files $uri =404;
  }

  location /bussiness_backoffice/backoffice/ {
   # include /etc/nginx/snippets/auth_check.conf;
    if ($should_block) {
        return 302 /business_banking/login;
    }
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri $uri/ /bussiness_backoffice/backoffice/index.html;
    limit_except GET HEAD { deny all; }
  }

  location /bussiness_backoffice/onboarding/ {
   # include /etc/nginx/snippets/auth_check.conf;
    if ($should_block) {
        return 302 /bussiness_backoffice/onboarding/login;
    }
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri $uri/ /bussiness_backoffice/onboarding/index.html;
    limit_except GET HEAD { deny all; }
  }

  location /business_banking/ {
    #include /etc/nginx/snippets/auth_check.conf;
    if ($should_block) {
        return 302 /business_banking/login;
    }
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri $uri/ /business_banking/index.html;
    limit_except GET HEAD { deny all; }
  }

  location /api/backoffice/ {
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/proxy_params.conf;
    client_max_body_size 350m;
    proxy_pass http://bussiness-backoffice-svc.apps.svc.cluster.local:80;
  }

  location /api/bussiness/ {
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/proxy_params.conf;
    rewrite ^/api/bussiness/(.*)$ /api/$1 break;
    client_max_body_size 100m;
    proxy_pass http://bussiness-bussiness-svc.apps.svc.cluster.local:80;
  }

  location / {
    include /etc/nginx/snippets/security_headers.conf;
    return 404;
  }
}

