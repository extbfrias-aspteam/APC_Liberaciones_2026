# Map para definir qué rutas son públicas (Bypass)
map $request_uri $is_public {
    default 0;
    "~*(index\.html|/|login|home)$" 1;
}

# Combinamos: si NO es pública (0) y NO hay cookie (:), bloqueamos
map "$is_public:$cookie_access_token" $should_block {
    "0:" 1;
    default 0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    

    proxy_connect_timeout 240s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    send_timeout 900s;
    # 1. Configuración Global de Seguridad (Shared Headers)
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # 2. Desactivar tokens de versión por seguridad
    server_tokens off;

    # 3. Lógica de SPA y Archivos Estáticos centralizada
    # Regla general para archivos estáticos (JS, CSS, Imágenes)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|json)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
	
	# ================= FRONTEND APPS =================

    # Location específica para Backoffice
    location /bussiness_backoffice/backoffice/ {
        if ($should_block) { return 403; }
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

        try_files $uri $uri/ /bussiness_backoffice/backoffice/index.html;
    }

    # Location específica para Onboarding
    location /bussiness_backoffice/onboarding/ {
        if ($should_block) { return 403; }

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

        try_files $uri $uri/ /bussiness_backoffice/onboarding/index.html;
    }

    # Location específica para Business Banking
    location /business_banking/ {
        if ($should_block) { return 403; }

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

        try_files $uri $uri/ /business_banking/index.html;
    }	
	
    # 5. BACKEND PROXY 
    location /api/backoffice/ {
        proxy_pass http://bussiness-backoffice-svc.apps.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/bussiness/ {
        rewrite ^/api/bussiness/(.*)$ /api/$1 break;
        proxy_pass http://bussiness-bussiness-svc.apps.svc.cluster.local:80;
        proxy_set_header Host $host;
    }
}
