<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 80"
  width="64"
  height="80"
>
  <!-- Documento -->
  <rect x="2" y="2" width="60" height="76" rx="4" ry="4" fill="#e5e7eb"/>

  <!-- Sombra difuminada (blur) -->
  <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
  </filter>
  <rect x="2" y="2" width="60" height="76" rx="4" ry="4" fill="#d1d5db" filter="url(#blurFilter)" opacity="0.6"/>

  <!-- Rectángulo PDF rojo -->
  <rect x="2" y="2" width="60" height="16" rx="2" ry="2" fill="#ef4444"/>

  <!-- Texto PDF -->
  <text x="32" y="14" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold" text-anchor="middle" alignment-baseline="middle">PDF</text>

  <!-- Líneas borrosas simulando contenido -->
  <rect x="6" y="24" width="52" height="4" rx="1" ry="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="6" y="32" width="48" height="4" rx="1" ry="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="6" y="40" width="50" height="4" rx="1" ry="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="6" y="48" width="46" height="4" rx="1" ry="1" fill="#9ca3af" opacity="0.5"/>
</svg>
