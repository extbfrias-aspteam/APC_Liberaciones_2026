# 1. Por defecto, no bloqueamos
set $bypass_auth "no";

# 2. Si es el index.html o la raíz de la carpeta, permitimos el acceso (Bypass)
if ($request_uri ~* "(index\.html|/|login|home)$") {
    set $bypass_auth "yes";
}

# 3. Solo bloqueamos si NO es bypass Y la cookie está vacía
set $check_lock "";
if ($bypass_auth = "no") {
    set $check_lock "B"; 
}
if ($cookie_access_token = "") {
    set $check_lock "${check_lock}E"; 
}

# Si el resultado es BE (Bypass No + Empty Cookie), cerramos la puerta
if ($check_lock = "BE") {
    return 403;
}

# Headers de control de caché para evitar que el navegador guarde el HTML protegido
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
add_header Pragma "no-cache" always;
expires off;
