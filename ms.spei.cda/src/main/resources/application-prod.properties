spring.config.import=sm@
spring.cloud.gcp.secretmanager.allow-default-secret=true

spring.datasource.url=${DB_URI}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

auth.datasource.url=${sm@AUTH_DB_URI}
auth.datasource.username=${sm@AUTH_DB_USERNAME}
auth.datasource.password=${sm@AUTH_DB_PASSWORD}

url.login=${URI_LOGIN}
url.pago=${URI_PAGO}
token.portal.pago=${TOKEN_SERVICIO_PAGO}
name.gcp.bucket=${NAME_BUCKET}

url.frontend=${URI_FRONTEND}
