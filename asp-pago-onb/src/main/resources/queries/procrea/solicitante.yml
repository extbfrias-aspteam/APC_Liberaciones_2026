solicitante:
  obtenerDatosBasicosById: "select s.numero, s.nombre, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, dt.telefono
                            from public.solicitante s 
                            join public.directorio_telefonico dt on dt.id_solicitante = s.numero
                            where s.numero = :numero and dt.id_cat_telefono = 7;"

  obtenerDatosBasicosByTelefonoCoDi: "select s.numero, s.nombre, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, dt.telefono
                                      from solicitante s 
                                      join directorio_telefonico dt on dt.id_solicitante = s.numero
                                      where dt.telefono = :telefonoCoDi and dt.id_cat_telefono = 7;"

  obtenerIdSolicitanteByCorreo: "select s.numero
                                 from public.solicitante s 
                                 where s.correo = :correo limit 1;"

  buscarSolicitanteByCurp: "select s.numero, s.nombre, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, coalesce(s.bloqueado, 0) as bloqueado,
                            s.apellidos as apellido_p, s.apellido_m, s.nombre_p, s.t_persona
                            from public.solicitante s 
                            where s.curp = :curp;"

  obtenerDatosGeneralesById: "select s.numero, s.nombre, s.nombre_p, s.apellidos as apellido_p, s.apellido_m, s.curp, s.rfc1 || s.rfc2 || s.rfc3 as rfc, s.correo, dt.telefono, s.domicilio,
                              solicitante2fechanacompleta(s.numero) as fecha_nacimiento, 
                              s.colonia, s.celular, coalesce(s.cat_domicilio1, 0) as cat_domicilio1, coalesce(s.cat_domicilio2, 0) as cat_domicilio2,
                              coalesce(s.cat_domicilio3, 0) as cat_domicilio3, coalesce(s.cat_domicilio4, 0) as cat_domicilio4, coalesce(s.cat_domicilio5, 0) as cat_domicilio5,
                              coalesce(s.descripcion_domicilio1, '') as descripcion_domicilio1, coalesce(s.descripcion_domicilio2, '') as descripcion_domicilio2, 
                              coalesce(s.descripcion_domicilio3, '') as descripcion_domicilio3, coalesce(s.descripcion_domicilio4, '') as descripcion_domicilio4,
                              coalesce(s.descripcion_domicilio5, '') as descripcion_domicilio5, coalesce(s.domicilo_observaciones, '') as domicilo_observaciones,
                              s.rfc1, s.rfc2, s.rfc3, s.sexo, s.t_persona, s.numero_casa,  coalesce(s.telefono, '') as telefono, coalesce(s.celular, '') as celular
                              from public.solicitante s 
                              join public.directorio_telefonico dt on dt.id_solicitante = s.numero
                              where s.numero = :numero and dt.id_cat_telefono = 7;"

  validaExisteSolicitante: "select exists(select numero from public.solicitante where numero = :numero) as existeSoliciante;"

  registrarNuevoSolicitante: "insert into public.solicitante(nombre, numero, nombre_p, apellidos, apellido_m, domicilio, colonia, celular, telefono, sexo, edo_civil, 
                              rfc1, rfc2, rfc3, curp, t_persona, correo, numero_casa, edo_nac_id, creado_por, fecha_creacion, 
                              cve_ocupacion, giro, puesto, descripcion_domicilio1) 
                              values (:nombre, :numero, :nombreP, :apellidos, :apellidoM, :domicilio, :colonia, :celular, :telefono, :sexo, :edoCivil, 
                              :rfc1, :rfc2, :rfc3, :curp, :tPersona, :correo, :numeroCasa, :edoNacId, 9, now(), 
                              :cveOcupacion, :giro, :puesto, :descripcionDomicilio1);"

  registraConceptoSolicitante: "insert into public.conceptos_solicitantes
					            (id_solicitante, cat_conceptos_id, valor, opctext1, usuario_creacion, fecha_creacion)
					            values (:personaId, (select id from cat_conceptos where clave = :clave), :valor, :opc, 9, now());"

  actualizarDatosSolicitante: "update solicitante set correo = :correo, domicilo_observaciones = :domicilo_observaciones, celular = :celular, modificado_por = 9, 
                               fecha_modificacion = now() where numero = :numero;"

  registrarBitacoraCambio: "insert into bit_autoriza (control, tipo, usuario_aut, fecha_mov, fecha_creacion, actual, nuevo, observaciones)
                            values(:control, :tipo, :usuario_aut, now(), now(), :actual, :nuevo, :obs);"


conceptos_solicitantes:
  obtenerConceptoSolicitanteByClave: "select valor from public.conceptos_solicitantes cs 
                                      where cs.cat_conceptos_id = (select cc.id from cat_conceptos cc where cc.clave = :claveConcepto) 
                                      and cs.id_solicitante = :personaId;"

  borrarConceptoBySolicitanteId: "delete from public.conceptos_solicitantes cs where cs.id_solicitante = :personaId and cs.cat_conceptos_id = :conceptoId"

  registrarConceptoBySolicitanteId: "insert into public.conceptos_solicitantes (id_solicitante, cat_conceptos_id, valor, usuario_creacion) 
                                     values (:personaId, :conceptoId, :valor, 9)"

  obtenerListadoConceptosSolicitanteByPersonaId: "select cc.clave, cs.id, cs.valor from public.solicitante s 
                                                  join public.conceptos_solicitantes cs on cs.id_solicitante = s.numero 
                                                  join public.cat_conceptos cc on cc.id = cs.cat_conceptos_id 
                                                  where s.numero = :personaId and cc.clave in ('SOLIC_COLONIA', 'PAIS_SOL');"

  guardarConceptoSolicitante: "insert into public.conceptos_solicitantes
					           (id_solicitante, cat_conceptos_id, valor, opctext1, usuario_creacion, fecha_creacion)
					           values (:personaId, (select cc.id from public.cat_conceptos cc where cc.clave = :clave), :valor, :optext, 9, now());"

  actualizarConceptoSolicitanteById: "update public.conceptos_solicitantes set valor = :valor, opctext1 = :optext, 
                                      fecha_modificacion = now(), usuario_modificacion = 9 where id = :id"

solicitante_ASPPAgo_RFCVALIDO:
  buscarSolicitanteCertificadoByCurp: "select sc.numero, sc.curp, sc.rfc from public.solicitante_ASPPAgo_RFCVALIDO sc where sc.curp = :curp limit 1;"

directorio_telefonico:
  validaExisteIdDirTelefonico: "select exists(select id_directorio_telefonico from public.directorio_telefonico where id_directorio_telefonico = :id) as existeDirTelefonico;"

  registraTelefonoCoDi: "insert into public.directorio_telefonico(id_directorio_telefonico, id_solicitante, id_cat_telefono, 
                         telefono, observaciones, creado_por, fecha_creacion) 
					     values (:id, :personaId, :idcatTelefono, :telefonoCoDi, :observaciones, 9, now());"

secuencias:
  sigSecSolicitante: "select nextval('solicitante_s');"

  sigSecDirectorioTelefonico: "select nextval('directorio_telefonico_id_directorio_telefonico_seq'::regclass);"
