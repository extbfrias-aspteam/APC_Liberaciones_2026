ahcuentas:
  obtenerDatosCuentaAhByCuentaAh: "select ac.cuenta, ac.id as cuentaId, pg.cuenta_clabe as clabe, pa.descripcion as descripcion, pa.clave as producto, pa.id as productoId, 
                                   coalesce(pg.tarjeta_principal, '') as tarjeta_principal, pg.tipo_tarjeta, pv.nombre as proveedor,
                                   coalesce(pg.tarjeta_adicional, '') as tarjeta_adicional, pg.tipo_tarjeta_adicional, pv2.nombre as proveedor_tarjeta_adicional,
                                   coalesce(cc.cuenta,'') as cuenta_pago, coalesce(cc2.cuenta, '') as cuenta_cobro, pg.estatusah from ahorro.ahcuentas ac
                                   join nucleocentral.ncposicionglobalah pg on pg.cuentaah = ac.cuenta
                                   join productos.prproductos_ahorro pa on pa.id = ac.producto_ahorro_id
                                   left join plasticos.plproveedores pv on pv.proveedor_id = pg.proveedor_id 
                                   left join plasticos.plproveedores pv2 on pv2.proveedor_id = pg.proveedor_tarjeta_adicional
                                   left join codi.cuentas_codi cc on cc.tipo_cuenta_id = 1 and cc.cuenta = pg.cuenta_clabe 
                                   left join codi.cuentas_codi cc2 on cc2.tipo_cuenta_id = 2 and cc2.cuenta = pg.cuenta_clabe
                                   where pg.cuentaah = :cuentaah;"

  obtenerDatosGeneralesCuentaAhByCuentaAh: "select ac.cuenta, ac.id as cuentaId, pg.cuenta_clabe as clabe, pa.descripcion as descripcion, 
                                            pa.clave as producto, pa.id as productoId, pg.estatusah, ac.persona_id 
                                            from ahorro.ahcuentas ac
                                            join nucleocentral.ncposicionglobalah pg on pg.cuentaah = ac.cuenta
                                            join productos.prproductos_ahorro pa on pa.id = ac.producto_ahorro_id
                                            where pg.cuentaah = :cuentaah;"

  obtenerCuentaExistenteByCuentaAh: "select ac.cuenta from ahorro.ahcuentas ac where ac.cuenta = :cuentaah;"

  obtenerCuentaExistenteByCuentaClabe: "select ac.clabe_interbancaria from ahorro.ahcuentas ac where ac.cuenta = :clabe;"

  altaCuentaAhorroSimplificada: "insert into ahorro.ahcuentas 
                                 (cuenta, estatus_id, persona_id, producto_ahorro_id, fecha_apertura, monto_apertura, sucursal_id, rendimiento, 
                                 gat_nominal, gat_real, moneda_id, asesor_id, como_entero_id, como_entero_obs, clabe_interbancaria, referencia, 
                                 fecha_creacion, usuario_creacion,tipo_cliente) 
		                         values (:cuenta, :estatus_id, :persona_id, :producto_ahorro_id, now(), :monto_apertura, :sucursal_id, :rendimiento, 
		                         :gat_nominal, :gat_real, :moneda_id, :asesor_id, :como_entero_id, :como_entero_obs, :clabe_interbancaria, :referencia,
		                         now(), 9, :tipo_cliente) returning id;"

  obtenerListadoCuentasCeroByPersonaId: "select a.cuenta, a.id, ae.clave as estatus, a.clabe_interbancaria 
                                         from ahorro.ahcuentas a 
                                         join ahorro.ahestatus ae on ae.id = a.estatus_id
                                         where a.persona_id = :personaId 
                                         and a.producto_ahorro_id = :productoId 
                                         and ae.clave in ('VIG', 'BLOQ')
                                         order by 
                                         case 
                                             when ae.clave = 'VIG' then 1
                                             when ae.clave = 'BLOQ' then 2
                                         end;"

  listarCuentasCeroMovimientoReciente: "SELECT 
                                          subquery.cuenta,
                                          subquery.clabe_interbancaria,
                                          subquery.cuenta_id, 
                                          subquery.clave,
                                          TO_CHAR(subquery.fecha, 'YYYY-MM-DD HH24:MI:SS') AS fechaHora
                                          FROM (
                                              SELECT 
                                                  ac.cuenta,
                                                  ac.clabe_interbancaria,
                                                  ac.id AS cuenta_id,  
                                                  e.clave,           
                                                  atc.fecha,
                                                  ROW_NUMBER() OVER (PARTITION BY ac.cuenta ORDER BY atc.fecha DESC) AS rn
                                              FROM ahorro.ahcuentas ac
                                              JOIN ahorro.ahtransacciones_cuentas atc ON ac.id = atc.cuenta_id
                                              JOIN ahorro.ahestatus e ON e.id = ac.estatus_id
                                              WHERE ac.cuenta IN (:cuentas)
                                          ) AS subquery
                                        WHERE subquery.rn = 1
                                        ORDER BY subquery.fecha DESC;"

  validaReferenciaAhorro: "select count(*)
                           from ahorro.ahcuentas a
                           where
                           a.cuenta ~ '^[0-9]+$'
                           and cast(substring(left(a.cuenta, length(a.cuenta) - 1) from 4) as integer) = :referencia
                           and a.producto_ahorro_id = 6
                           and a.cuenta like '062%';"

ahcuentas_ahorro_datos:
  obtenerConceptoCuentaByClave: "select cad.valor, cad.id from ahorro.ahcuentas ac
                                 join ahorro.ahcuentas_ahorro_datos cad on cad.cuenta_id = ac.id
                                 join nucleocentral.ncconceptos nc on nc.id = cad.concepto_id
                                 where ac.persona_id = :personaId and ac.cuenta = :cuentaah and nc.clave = :clave;"

  obtenerListadoConceptosCuentaSimplificadaCeroByCuentaAh: "select nc.clave, cad.id from ahorro.ahcuentas ac 
                                                            join ahorro.ahcuentas_ahorro_datos cad on cad.cuenta_id = ac.id
                                                            join nucleocentral.ncconceptos nc on nc.id = cad.concepto_id
                                                            where ac.persona_id = :personaId and ac.cuenta = :cuentaah 
                                                            and nc.clave in (:claves);"

  obtenerListadoConceptosProductoCuentaByCuenta: "select pr.concepto_id, n.clave, pr.estatus_id, pr.id, pr.valor 
                                                  from productos.prproductos_ahorro_datos pr
                                                  join nucleocentral.ncconceptos n on n.id = pr.concepto_id
                                                  join ahorro.ahcuentas_ahorro_datos ad on ad.concepto_id = n.id
                                                  join ahorro.ahcuentas a on a.id = ad.cuenta_id 
                                                  where pr.producto_id = :productoId and a.cuenta = :cuentaah;"

  guardarConceptoCuenta: "insert into ahorro.ahcuentas_ahorro_datos
                          (cuenta_id, concepto_id, estatus_id, valor, usuario_creacion, fecha_creacion)
                          (select ac.id as cuenta_id, nc.id as concepto_id, 1 as estatus_id, :valor as valor, 
                          9 as usuario_creacion, now() as fecha_creacion 
                          from nucleocentral.ncconceptos nc cross join ahorro.ahcuentas ac
                          where nc.clave = :clave
                          and cuenta = :cuentaah);"

  guardarConceptoCuentaById: "insert into ahorro.ahcuentas_ahorro_datos
                              (cuenta_id, concepto_id, estatus_id, valor, usuario_creacion, fecha_creacion)
                              (select ac.id as cuenta_id, nc.id as concepto_id, 1 as estatus_id, :valor as valor, 
                              9 as usuario_creacion, now() as fecha_creacion 
                              from nucleocentral.ncconceptos nc cross join ahorro.ahcuentas ac
                              where nc.id = :id
                              and cuenta = :cuentaah);"

  actualizarValorConceptoCuentaById: "update ahorro.ahcuentas_ahorro_datos set valor = :valor where id = :id;"

ahcuentas_beneficiarios:
  obtenerBeneficiarioCuentaAhByCuentaId: "select ahcb.nombre_beneficiario, ahcb.relacion_id, ahcb.porcentaje, ahcb.detalle_estatus, ac.cuenta
                                          from ahorro.ahcuentas_beneficiarios ahcb
                                          join ahorro.ahcuentas ac on ac.id = ahcb.cuenta_id
                                          where ac.id = :cuentaId;"

  obtenerBeneficiarioCuentaAhByCuentaAh: "select ahcb.nombre_beneficiario, ahcb.relacion_id, ahcb.porcentaje, ahcb.detalle_estatus, ac.cuenta
                                          from ahorro.ahcuentas_beneficiarios ahcb
                                          join ahorro.ahcuentas ac on ac.id = ahcb.cuenta_id
                                          where ac.cuenta = :cuentaah;"

  guardarBeneficiarioCuentaAh: "insert into ahorro.ahcuentas_beneficiarios 
                                (cuenta_id, nombre_beneficiario, relacion_id, porcentaje, fecha_creacion, estatus_id, usuario_creacion, persona_id, detalle_estatus) 
		                        values(:cuentaId, :nombreBeneficiario, :relacionId, :porcentaje, now(), 1, 9, '0BF', false) returning id;"

ahnivel_cuenta_ahorro:
  obtenerMontoMaxAhorro: "select a.clave, a.monto_max_mxn from ahorro.ahnivel_cuenta_ahorro a where a.clave = :clave;"

ahcuentas_pld:
  guardarInformacionPld: "insert into ahorro.ahcuentas_pld
                          (cuenta_id, monto_max_aho, ingresos_men, puesto, estatus_id, fecha_creacion, usuario_creacion, ind_prov_rec) 
		                  values (:cuenta_id, :monto_max_aho, :ingresos_men, :puesto, :estatus_id, now(), 9, false);"

ahconceptos_pld:
  guardarConceptoPld: "insert into ahorro.ahconceptos_pld 
                       (cuenta_id, conceptos_id, valor, fecha_creacion, usuario_creacion) 
                       values (:cuenta_id, :conceptoId, :valor, now(), 9);"

secuencias:
  sigSecReferenciaAhorro: "select nextval('ahorro.referencia_sec');"

