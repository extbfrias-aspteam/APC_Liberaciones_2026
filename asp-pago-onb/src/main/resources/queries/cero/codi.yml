registro_codi:
  obtenerRegistroCoDiByCuentaAh: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                  coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                  coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales
                                  from codi.registro_codi rc 
                                  join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                  where rc.cuenta = :cuentaah and rc.activo = true;"

  obtenerListRegistroCoDiByCuentasAh: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                  coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                  coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales
                                  from codi.registro_codi rc 
                                  join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                  where rc.cuenta IN (:cuentasAh) and rc.activo = true;"

  obtenerRegistroCoDiIndividualByCuentaAh: "select rc.id, rc.cuenta, rc.solicitante_id, rc.id_hardware,      
                                            coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, 
                                            coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales
                                            from codi.registro_codi rc 
                                            where rc.cuenta = :cuentaah;"

  obtenerRegistroCoDiByPersonaId: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                   coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                   coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales
                                   from codi.registro_codi rc 
                                   join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                   where rc.solicitante_id = :personaId and rc.activo = true;"

  consultarRegistroCoDiCliente: "select rc.id, rc.cuenta, rc.solicitante_id, rsd.password, rc.id_hardware, 
                                 coalesce(rsd.registro_nueva_app, '1') registro_nueva_app, rc.activo, coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                 coalesce(rc.bloqueado, 0) as bloqueado, rc.fecha_bloqueo, coalesce(rc.intentos, 0) as intentos, coalesce(rc.bloqueos_temporales, 0) as bloqueos_temporales, rc.principal
                                 from codi.registro_codi rc 
                                 join codi.registro_servicios_digitales rsd on rsd.cuenta = rc.cuenta
                                 where rc.solicitante_id = :personaId and rc.activo = true and rsd.registro_nueva_app = '2';"

  actualizarIdHardwareByCuentaAh: "update codi.registro_codi set id_hardware = :dispositivoId where cuenta = :cuentaah;"

  guardarRegistroCoDi: "insert into codi.registro_codi (cuenta, solicitante_id, folio_contrato, estatus, numero_celular, principal, fecha_creacion) 
                        values (:cuenta, :personaId, :folio, :estatus, :numero_celular, :principal, now());"

  actualizarRegistroCoDiActivo: "update codi.registro_codi 
                                 set activo = true
                                 where solicitante_id = :personaId and cuenta = :cuentaah;"

  actualizarBloquearRegistroCoDi: "update codi.registro_codi set bloqueado = :bloqueado, fecha_bloqueo = :fbloqueo, 
                                   fecha_modificacion = now() where cuenta = :cuentaah;"

  actualizarRegistroCoDiById: "update codi.registro_codi set folio_contrato = :folio, estatus = :estatus, numero_celular = :numero_celular,               
                               bloqueado = 0, fecha_bloqueo = null, intentos = 0, bloqueos_temporales = 0, principal = :principal, solicitante_id = :solicitante,
                               fecha_modificacion = now() where id = :id;"

registro_servicios_digitales:
  guardarRegistroServiciosDigitales: "insert into codi.registro_servicios_digitales (cuenta, password, folio_contrato, estatus, registro_nueva_app,
                                      telefono_validado, usuario_creacion, fecha_creacion) 
                                      values (:cuentaah, :password, :folio, :estatus, :registroNuevaApp, :telefono_validado, 9, now());"

  actualizarVersionAppRegistroServiciosDigitales: "update codi.registro_servicios_digitales set registro_nueva_app = :registroNuevaApp,
                                                   fecha_modificacion = now(), usuario_modificacion = 9
                                                   where cuenta = :cuentaah;"

  obtenerRegistroServiciosDigitalesIndividualByCuentaAh: "select rsd.id, rsd.cuenta, rsd.password, rsd.folio_contrato, rsd.estatus,
                                                          coalesce(rsd.telefono_validado, 'NO') telefono_validado,
                                                          coalesce(rsd.registro_nueva_app, '1') registro_nueva_app
                                                          from codi.registro_servicios_digitales rsd
                                                          where rsd.cuenta = :cuentaah;"

  actualizarRegistroServiciosDigitalesById: "update codi.registro_servicios_digitales set registro_nueva_app = :registroNuevaApp, password = :password,
                                             estatus = :estatus, telefono_validado = :telefono_validado, fecha_modificacion = now(), usuario_modificacion = 9
                                             where id = :id;"

onboardings_ejecutados:
  buscaOnboardingEjecutadoPendiente: "select onb.id, onb.fecha_creacion from codi.onboardings_ejecutados onb 
                                      where onb.rfc = :rfc and onb.curp = :curp and onb.telefono = :telefono and onb.completada = 0
                                      order by onb.fecha_creacion desc limit 1;"

  registraOnboardingEjecutado: "insert into codi.onboardings_ejecutados(completada, rfc, curp, telefono, fecha_creacion) 
                                values (0, :rfc, :curp, :telefono, now()) returning id;"

  finalizaOnboardingEjecutado: "update codi.onboardings_ejecutados 
                                set completada = 1, fecha_modificacion = now()
                                where id = :id;"

bitacora_procesamiento:
  nuevoBitPro: "insert into codi.bitacora_procesamiento(id, cuenta, operacion_id, fecha_inicio, fecha_fin, id_procesamiento) 
				values (:id, :cuenta, :operacion_id, :fhInicio, :fhFin, :idProcesamiento);"

  sigSecProId: "select nextval('codi.bitacora_procesamiento_id_procesamiento_seq'::regclass);"

  sigSecBitPro: "select nextval('codi.bitacora_procesamiento_id_seq'::regclass);"