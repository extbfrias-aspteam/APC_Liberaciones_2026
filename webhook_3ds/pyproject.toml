[tool.poetry]
name = "dock-services"
version = "0.1.0"
description = "Notifications Central"
authors = ["Bryan Polito <correo@example.com>"]
readme = "README.md"
packages = [
    { include = "src" }  # Asegúrate de que esto coincida con el directorio de tu código fuente
]


[tool.poetry.dependencies]
python = ">=3.9.2"
requests = ">=2.32.3,<3.0.0"
uvicorn = {extras = ["standard"], version = "^0.34.3"}
fastapi = ">=0.115.8,<0.116.0"
sqlmodel = ">=0.0.22,<0.0.23"
cryptography = ">=44.0.2,<45.0.0"
pycryptodome = ">=3.21.0,<4.0.0"
pycryptodomex = ">=3.21.0,<4.0.0"
psycopg2 = "^2.9.10"
python-json-logger = "^3.3.0"
pydantic-settings = "^2.8.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
