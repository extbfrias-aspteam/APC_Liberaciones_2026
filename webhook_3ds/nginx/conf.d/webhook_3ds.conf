# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name wh3dsbeta.aspintegraopciones.mx;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuración HTTPS
server {
    listen 443 ssl;
    server_name wh3dsbeta.aspintegraopciones.mx;
    
    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/webhook_3ds.crt;
    ssl_certificate_key /etc/nginx/ssl/webhook_3ds.key;
    
    # Configuración de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    
    # Proxy para la ruta /dock-3ds-webhook
    location /dock-3ds-webhook {
        proxy_pass http://webhook_3ds:8000/dock-3ds-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Soporte para multipart/form-data
        client_max_body_size 10M;
        
        # Timeouts
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }
    
    # Página de error por defecto
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }

    # Página de error por defecto
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
