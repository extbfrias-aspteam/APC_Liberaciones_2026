ahorro_contrato:
  obtenerListadoCuentasProcreaByPersonaId: "select ac.cuenta, ac.estatus, ac.cuenta_clabe from ahorro_contrato ac 
                                            where ac.solicitante_id = :personaId and ac.tipo_ahorro_id = :productoId and ac.estatus in ('V', 'B')
                                            order by 
                                            case 
                                                when ac.estatus = 'V' then 1
                                                when ac.estatus = 'B' then 2
                                            end;"

  obtenerListadoCuentasVigentesProcreaByPersonaId: "select ac.cuenta, ac.estatus, ac.cuenta_clabe from ahorro_contrato ac 
                                                    where ac.solicitante_id = :personaId and ac.tipo_ahorro_id = :productoId 
                                                    and ac.estatus in ('V');"

  listarCuentasProcreaMovimientoReciente: "SELECT 
                                           TO_CHAR(mc.fecha_creacion, 'YYYY-MM-DD HH24:MI:SS') AS fechaHora,
                                           mc.cuenta,
                                           ac.estatus,
                                           ac.cuenta_clabe 
                                           FROM movimientos_caja mc
                                           JOIN ahorro_contrato ac ON mc.cuenta = ac.cuenta
                                           WHERE mc.cuenta IN (:cuentas)
                                           AND mc.fecha_creacion = (
                                             SELECT MAX(mc2.fecha_creacion)
                                             FROM movimientos_caja mc2
                                             WHERE mc2.cuenta = mc.cuenta
                                           )
                                           ORDER BY mc.fecha_creacion DESC;"