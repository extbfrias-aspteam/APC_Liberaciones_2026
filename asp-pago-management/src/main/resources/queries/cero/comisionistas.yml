coservicios_empresas:
  obtenerListadoServiciosTerceros: "select ce.id, ce.servicio, ce.tipo_producto, ce.tipo_servicio, ce.nememp, ce.subemp, coalesce(ce.comision, 0) as comision, ce.esfavorito,
                                    cc.servicio_codigo as codigo, 'https://www.aspintegraopciones.com/fr/images/5oueS5qmxoyp/' || ri.nombre_img as url  
                                    from comisionistas.coservicios_empresas ce
                                    join comisionistas.coservicios_codigos cc
                                    on ce.codigo_servicio = cc.id 
                                    left join public.repositorio_imagenes ri 
                                    on ce.id_img = ri.id 
                                    where ce.tipo_servicio = 'Terceros' and ce.activo = 'SI'
                                    and ri.activo = 'SI'and ri.concepto = 'ASPPAGO_PAGOSERVICIOS' 
                                    order by ce.servicio asc;"

  obtenerListadoRecargasTelefonicas: "select ce.id, ce.servicio, ce.tipo_producto, ce.tipo_servicio, ce.nememp, ce.subemp, coalesce(ce.comision, 0) as comision,
                                      cc.servicio_codigo as codigo, 'https://www.aspintegraopciones.com/fr/images/5oueS5qmxoyp/' || ri.nombre_img as url 
                                      from comisionistas.coservicios_empresas ce
                                      join comisionistas.coservicios_codigos cc
                                      on ce.codigo_servicio = cc.id 
                                      left join public.repositorio_imagenes ri 
                                      on ce.id_img = ri.id 
                                      where ce.tipo_servicio = 'Recargas' and ce.activo = 'SI'
                                      and ri.activo = 'SI'and ri.concepto = 'ASPPAGO_PAGOSERVICIOS' 
                                      order by ce.servicio asc;"

coservicios_montos:
  obtenerMontosRecargasTelefonicas: "select cm.id, cm.monto, cm.producto 
                                     from comisionistas.coservicios_montos cm
                                     where cm.servicio_id = :id and cm.activo = 'SI' 
                                     order by cm.monto asc;"