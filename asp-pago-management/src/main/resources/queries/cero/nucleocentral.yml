ncposicionglobalah:
  obtenerCuentaPosicionGlobalByPersonaId: "select tipocuentaah, cuentaah, cuenta_clabe
                                           from nucleocentral.ncposicionglobalah
                                           where idpersona = :personaId;"

  obtenerCuentaPosicionGlobalByCuentaAh: "select pg.tipocuentaah, pg.cuentaah, pg.cuenta_clabe, pg.idpersona, coalesce(cc.cuenta, '') as cuenta_pago,
                                           coalesce(cc2.cuenta, '') as cuenta_cobro, pg.estatusah,
                                           coalesce(pg.tarjeta_principal, '') as tarjeta_principal,
                                           coalesce(pg.tarjeta_adicional, '') as tarjeta_adicional
                                           from nucleocentral.ncposicionglobalah  pg
                                           left join ahorro.ahcuentas ac on ac.cuenta = pg.cuentaah
                                           left join codi.registro_codi rc on rc.cuenta = pg.cuentaah
                                           left join codi.cuentas_codi cc on cc.tipo_cuenta_codi_id = 1 and cc.registro_codi_id = rc.id
                                           left join codi.cuentas_codi cc2 on cc2.tipo_cuenta_id = 2 and cc2.registro_codi_id = rc.id
                                           where pg.cuentaah = :cuentaah;"

  obtenerPosicionGlobalCuenta: "SELECT tipocuentaah FROM nucleocentral.ncposicionglobalah WHERE estatusah = 'VIG' and cuentaah = :cuenta;"

  obtenerCuentaPosicionGlobalByCuentaClabe: "select pg.tipocuentaah, pg.cuentaah, pg.cuenta_clabe, pg.idpersona, coalesce(cc.cuenta, '') as cuenta_pago,
                                           coalesce(cc2.cuenta, '') as cuenta_cobro, pg.estatusah,
                                           coalesce(pg.tarjeta_principal, '') as tarjeta_principal,
                                           coalesce(pg.tarjeta_adicional, '') as tarjeta_adicional
                                           from nucleocentral.ncposicionglobalah  pg
                                           left join ahorro.ahcuentas ac on ac.cuenta = pg.cuentaah
                                           left join codi.registro_codi rc on rc.cuenta = pg.cuentaah
                                           left join codi.cuentas_codi cc on cc.tipo_cuenta_codi_id = 1 and cc.registro_codi_id = rc.id
                                           left join codi.cuentas_codi cc2 on cc2.tipo_cuenta_id = 2 and cc2.registro_codi_id = rc.id
                                           where pg.cuenta_clabe = :clabe;"

  obtenerCuentaPosicionGlobalByTarjetaPrincipal: "select pg.tipocuentaah, pg.cuentaah, pg.cuenta_clabe, pg.idpersona, coalesce(cc.cuenta, '') as cuenta_pago,
                                                  coalesce(cc2.cuenta, '') as cuenta_cobro, pg.estatusah,
                                                  coalesce(pg.tarjeta_principal, '') as tarjeta_principal,
                                                  coalesce(pg.tarjeta_adicional, '') as tarjeta_adicional
                                                  from nucleocentral.ncposicionglobalah  pg
                                                  left join codi.registro_codi rc on rc.cuenta = pg.cuentaah
                                                  left join codi.cuentas_codi cc on cc.tipo_cuenta_codi_id = 1 and cc.registro_codi_id = rc.id
                                                  left join codi.cuentas_codi cc2 on cc2.tipo_cuenta_id = 2 and cc2.registro_codi_id = rc.id
                                                  where pg.tarjeta_principal = :tarjeta_principal;"

  obtenerCuentaPosicionGlobalByTarjetaAdicional: "select pg.tipocuentaah, pg.cuentaah, pg.cuenta_clabe, pg.idpersona, coalesce(cc.cuenta, '') as cuenta_pago,
                                                  coalesce(cc2.cuenta, '') as cuenta_cobro, pg.estatusah,
                                                  coalesce(pg.tarjeta_principal, '') as tarjeta_principal,
                                                  coalesce(pg.tarjeta_adicional, '') as tarjeta_adicional
                                                  from nucleocentral.ncposicionglobalah  pg
                                                  left join codi.registro_codi rc on rc.cuenta = pg.cuentaah
                                                  left join codi.cuentas_codi cc on cc.tipo_cuenta_codi_id = 1 and cc.registro_codi_id = rc.id
                                                  left join codi.cuentas_codi cc2 on cc2.tipo_cuenta_id = 2 and cc2.registro_codi_id = rc.id
                                                  where pg.tarjeta_adicional = :tarjeta_adicional;"

ncposicionglobalcr:
  obtenerCreditosActivosByPersonaId: "select c.cuenta , c.monto::numeric, c.referencia, nc.idpersona, nc.estadocr, nc.cuenta_clabe
                                      from nucleocentral.ncposicionglobalcr nc join credito.crcreditos c on nc.contratocr = c.cuenta
                                      where c.validado = 3 and c.revisado = 3 and nc.estadocr  = 'ACTIVO' and nc.idpersona = :personaId;"