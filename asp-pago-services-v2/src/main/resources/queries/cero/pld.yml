pldcat_ingresos:
  obtnenerCatIngresos: "select cing.id,
                        case 
                           when cing.monto_min = 50000 AND cing.monto_max = 0 
                               then 'Más de ' || CAST(cing.monto_min AS TEXT) 
                           else CAST(cing.monto_min AS TEXT) || ' a ' || CAST(cing.monto_max AS TEXT)  
                        end as valor 
                        from pld.pldcat_ingresos cing where cing.activo = true order by cing.id asc;"
pldcat_ahorros:
  obtnenerCatAhorros: "select caho.id, 
                       case 
                           when caho.monto_min = 50000 AND caho.monto_max = 0 
                               then 'Más de ' || CAST(caho.monto_min AS TEXT) 
                           else CAST(caho.monto_min AS TEXT) || ' a ' || CAST(caho.monto_max AS TEXT)  
                       end as valor  
                       from pld.pldcat_ahorros caho where caho.activo = true order by caho.id asc;"
pldcat_ocupacion:
  obtnenerCatOcupaciones: "select cocp.id, cocp.valor from pld.pldcat_ocupacion cocp where cocp.activo = true order by cocp.id asc;"
pldcat_frecuencia:
  obtnenerCatFrecuencia: "select cfrc.id, cfrc.valor from pld.pldcat_frecuencia cfrc where cfrc.activo = true order by cfrc.id asc;"
pldcat_objetivo:
  obtnenerCatObjetivos: "select cobj.id, cobj.valor from pld.pldcat_objetivo cobj where cobj.activo = true order by cobj.id asc;"
pldcat_actividad:
  obtnenerCatActividades: "select cact.id, cact.valor from pld.pldcat_actividad cact where cact.activo = true order by cact.id asc;"
pldcat_giro:
  obtnenerCatGirosByActividadId: "select cgr.id, cgr.valor from pld.pldcat_giro cgr where cgr.activo = true and cgr.pldcat_actividad_id = :actividadId order by cgr.id asc;"
pldformulario:
  guardarPldFormulario: "insert into pld.pldformulario (ahcuenta, pldcat_ingresos_id, pldcat_ahorros_id, pldcat_frecuencia_id, pldcat_actividad_id, pldcat_giro_id, 
                         pldcat_ocupacion_id, pldcat_objetivo_id, terminos_condiciones, ubicación_latitud, ubicación_longitud)
                         values(:cuentaah, :ingresos_id, :cat_ahorros_id, :frecuencia_id, :actividad_id, :giro_id, :ocupacion_id, :objetivo_id, 
                         :terminos, :latitud, :longitud);"

  obtenerPLDFormularioByCuentaAh: "select pf.id, pf.ahcuenta, pa.valor as actividad, pfc.valor as frecuencia, pg.valor as giro, pob.valor as objetivo, poc.valor as ocupacion,
                                      case 
                                           when pah.monto_min = 50000 AND pah.monto_max = 0 
                                                then 'Más de ' || CAST(pah.monto_max AS TEXT) 
                                      else CAST(pah.monto_min AS TEXT) || ' a ' || CAST(pah.monto_max AS TEXT)  
                                      end as ahorros_mensuales,
                                      case 
                                           when pin.monto_min = 50000 AND pin.monto_max = 0 
                                                then 'Más de ' || CAST(pin.monto_max AS TEXT) 
                                      else CAST(pin.monto_min AS TEXT) || ' a ' || CAST(pin.monto_max AS TEXT)  
                                      end as ingresos_mensuales, pf.ubicación_longitud as longitud, pf.ubicación_latitud as latitud 
                                   from pld.pldformulario pf
                                   join pld.pldcat_actividad pa on pa.id = pf.pldcat_actividad_id
                                   join pld.pldcat_frecuencia pfc on pfc.id = pf.pldcat_frecuencia_id 
                                   join pld.pldcat_giro pg on pg.id = pf.pldcat_giro_id 
                                   join pld.pldcat_objetivo pob on pob.id = pf.pldcat_objetivo_id 
                                   join pld.pldcat_ocupacion poc on poc.id = pf.pldcat_ocupacion_id
                                   join pld.pldcat_ahorros pah on pah.id = pf.pldcat_ahorros_id 
                                   join pld.pldcat_ingresos pin on pin.id = pf.pldcat_ingresos_id
                                   where pf.ahcuenta = :cuentaah; "
