seincode_proceso:
  guardarSesionIncode: "insert into seguridad.seincode_proceso (sesion_incode_id, token_incode, incat_modulo_id, cuentaah) 
                        values (:sesionId, :token, :moduloId, :cuentaah);"

  obtenerSesionIncode: "select irp.sesion_incode_id, irp.incat_modulo_id, irp.token_incode, icm.descripcion 
                        from seguridad.seincode_proceso irp 
                        join seguridad.seincode_cat_modulos icm on irp.incat_modulo_id = icm.id
                        where irp.cuentaah = :cuentaah and irp.activo = :activo;"

  actualizarSesionIncode: "update seguridad.seincode_proceso set incat_modulo_id = :moduloId 
                           where sesion_incode_id = :sesionId and cuentaah = :cuentaah;"

  finalizarSesionIncode: "update seguridad.seincode_proceso set activo = false, estatus = :estatus, usuario_modificacion = :usuario, fecha_modificacion = now()
                             where sesion_incode_id = :sesionId and cuentaah = :cuentaah;"

  actualizarEstatusSesionIncode: "update seguridad.seincode_proceso set estatus = :estatus, usuario_modificacion = :usuario, fecha_modificacion = now()
                             where sesion_incode_id = :sesionId and cuentaah = :cuentaah;"

  obtenerCuentaBySesionId: "select sp.cuentaah from seguridad.seincode_proceso sp
                             where sp.sesion_incode_id = :sesionId;"

  finalizarSesionIncodeManual: "update seguridad.seincode_proceso set activo = false, estatus = :estatus, usuario_modificacion = :usuario, fecha_modificacion = now()
                             where sesion_incode_id = :sesionId;"

  obtenerCorreos: "select sni.correo from seguridad.secorreo_notificacion_incode sni where activo = true;"

seincode_cat_modulos:
  seincode_cat_modulos: "select id, clave, descripcion, activo from seguridad.seincode_cat_modulos
                         where activo = true and id = :moduloId;"

seuuid_sospechosos:
  registraUUIDSospechoso: "insert into seguridad.seuuid_sospechosos
						   (uuid_txt, uuid_signed, ip_cliente, endpoint, observaciones)
						   values 
						   (:uuid_txt, :uuid_signed, :ip_cliente, :endpoint, :observaciones);"