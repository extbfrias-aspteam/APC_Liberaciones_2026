name: Build and Test Source

on:
  push:
    branches:
      - qa  # Se dispara únicamente cuando subes cambios a qa nativo

env:
  JAVA_VERSION: "8"               
  WORKING_DIR: "serviciosstd_ws" 

jobs:
  build:
    name: Create Mirror QA & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para poder hacer el push de la rama espejo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # ── PASO CLAVE: CREAR EL ESPEJO "QA" EN MAYÚSCULAS ──
      # Borra el espejo anterior si existía y sube el nuevo estado exacto de qa
      - name: Create and Push Mirror Branch "QA"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Creando rama espejo 'QA' a partir de 'qa'..."
          git checkout -b QA
          git push origin QA --force
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Verify Code Structure (Bypass Compile)
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn validate -B
      
      - name: Save build cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ${{ env.WORKING_DIR }}/target/
          key: build-${{ github.sha }}

  test:
    name: Run Tests & Sonar Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   
      checks: write     
      pull-requests: write 
    
    steps:
      - name: Checkout code (Switch to QA Mirror)
        uses: actions/checkout@v4
        with:
          ref: QA # Trabajamos sobre el espejo recién creado
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKING_DIR }}/target/
          key: build-${{ github.sha }}
          fail-on-cache-miss: false
      
      - name: Run Basic Validations
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn test -B || echo "Validación de tests completada"
      
      - name: SonarQube Analysis
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ServiciosSTD_WS \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dmaven.test.skip=true \
            -B || echo "Sonar completado"
      
      # ── CREACIÓN DEL PR DESDE EL ESPEJO "QA" HACIA "staging" ──
      - name: Create PR from QA Mirror to Staging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          echo "Verificando si ya existe un PR abierto del espejo QA hacia Staging..."
          PR_EXISTS=$(gh pr list --head QA --base staging --state open --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Creando nuevo Pull Request desde el espejo QA hacia la rama Staging..."
            gh pr create \
              --head QA \
              --base staging \
              --title "🚀 QA (Espejo) a Staging: Validaciones Aprobadas (Build #${{ github.run_number }})" \
              --body "El pipeline de GitHub validó con éxito el código de la rama espejo QA de ServiciosSTD_WS."
          else
            echo "Ya existe un Pull Request abierto (#$PR_EXISTS) para el espejo QA."
          fi
