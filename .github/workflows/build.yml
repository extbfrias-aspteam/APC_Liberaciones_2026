name: Build

on:
  push:
    branches:
      - qa

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Actualizado de v2 a v4
        with:
          fetch-depth: 0  # Deshabilita clones superficiales para mejorar SonarQube

      - name: Set up JDK 21
        uses: actions/setup-java@v4  # Actualizado de v1 a v4
        with:
          java-version: '21'
          distribution: 'temurin'  # Requerido en las versiones nuevas de setup-java

      - name: Cache SonarQube packages
        uses: actions/cache@v4  # Actualizado de v1 a v4 (Soluciona tu error)
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4  # Actualizado de v1 a v4 (Soluciona tu error)
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B -f ceroahorrows.war/CEROAhorroWS/pom.xml verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=extbfrias-aspteam_Jenkins-Realworld-CICD-Project_AZ8Wcm5tMb0D80z0WSTJ
