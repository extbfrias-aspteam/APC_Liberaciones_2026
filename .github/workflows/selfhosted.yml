name: Sync QA

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repositorio origen"
        required: true
        default: "aspintegraopciones/asp-pago-management"

      source_branch:
        description: "Rama origen"
        required: true
        default: "main"

      target_branch:
        description: "Rama destino"
        required: true
        default: "QA"

jobs:

  sync:

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      - name: Checkout repositorio destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        shell: powershell
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Agregar remoto QA
        shell: powershell
        run: |
          if (git remote | Select-String "qa") {
              git remote remove qa
          }

          git remote add qa https://github.com/${{ inputs.source_repo }}.git

      - name: Obtener ramas
        shell: powershell
        run: |
          git fetch qa --prune

      - name: Mostrar ramas remotas
        shell: powershell
        run: |
          git branch -r

      - name: Cambiar a rama destino
        shell: powershell
        run: |
          git checkout ${{ inputs.target_branch }}

      - name: Merge
        shell: powershell
        run: |
          git merge qa/${{ inputs.source_branch }} --no-edit

      - name: Push
        shell: powershell
        run: |
          git push origin ${{ inputs.target_branch }}

      - name: Últimos commits
        shell: powershell
        run: |
          git log --oneline -5
