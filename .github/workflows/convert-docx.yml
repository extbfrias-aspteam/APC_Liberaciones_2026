name: Convert DOCX to Markdown (Local Windows Runner)

on:
  push:
    paths:
      - '**.docx'
  workflow_dispatch:

jobs:
  convert-docs:
    runs-on: [self-hosted, windows]

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          # Necesario para poder hacer push de vuelta desde la misma rama
          fetch-depth: 0

      - name: Convertir archivos .docx a Markdown en Windows
        shell: powershell
        run: |
          # Crear directorio de imágenes si no existe
          if (!(Test-Path "docs/images")) {
              New-Item -ItemType Directory -Force -Path "docs/images"
          }

          # Buscar y convertir todos los archivos .docx
          Get-ChildItem -Recurse -Filter "*.docx" | ForEach-Object {
              $docxPath = $_.FullName
              $dir = $_.DirectoryName
              $baseName = $_.BaseName
              $mdPath = Join-Path $dir "$baseName.md"
              $imagesDir = Join-Path $dir "images"

              Write-Host "Converting $docxPath -> $mdPath ..."

              pandoc "$docxPath" -f docx -t gfm --extract-media="$imagesDir" -o "$mdPath"
          }

      - name: Commit y Push de los cambios
        shell: powershell
        run: |
          # Configurar identidad de Git temporal para la acción
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Agregar archivos Markdown e imágenes generadas
          git add *.md *.png *.jpg *.jpeg

          # Verificar si hay cambios pendientes antes de hacer commit
          $status = git status --porcelain
          if ($status) {
              Write-Host "Cambios detectados, realizando commit..."
              git commit -m "docs: conversión automática local de .docx a .md vía Pandoc [skip ci]"
              git push
          } else {
              Write-Host "No hay cambios para guardar."
          }