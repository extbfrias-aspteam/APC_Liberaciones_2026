name: APC_Liberaciones_2026

on:
  push:
    branches:
      - qa

jobs:
  build:
    name: APC_Liberaciones_2026
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Actualizado a v4 para evitar advertencias de Node
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # <-- ESTO SOLUCIONA TU ERROR GENERAL

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Detecta qué archivos cambiaron en este push específico
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45

      # Analiza de forma quirúrgica solo los directorios con cambios
      - name: Dynamic and Incremental Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_NEW_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B -f ceroahorrows.war/CEROAhorroWS/pom.xml verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=APC-Liberaciones_2026
