name: Sync QA / Staging / Main

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repositorio origen de QA (owner/repo)"
        required: true
        default: "aspintegraopciones/REPO_QA_ORIGEN"
      source_branch:
        description: "Rama origen"
        required: true
        default: "main"
      target_branch:
        description: "Rama destino inicial"
        required: true
        default: "QA"

jobs:
  sync:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout repo destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Git
        shell: powershell
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Agregar remoto QA origen
        shell: powershell
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote remove qa 2>$null
          git remote add qa "https://x-access-token:$env:GH_TOKEN@github.com/$env:SOURCE_REPO.git"
          git fetch qa --prune

      - name: Sincronizar main -> QA
        shell: powershell
        run: |
          git checkout ${{ inputs.target_branch }}
          git merge --no-edit qa/${{ inputs.source_branch }}
          git push origin ${{ inputs.target_branch }}

      - name: Mostrar estado final
        shell: powershell
        run: |
          git log --oneline -n 3