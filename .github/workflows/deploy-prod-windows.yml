name: Pipeline Prod Deploy - Banca Hypertech (Windows Runner)

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Nombre del microservicio (ej. bussiness-backoffice, domain-banking, html-empresarial)'
        required: true
        default: 'bussiness-backoffice'
      release_tag:
        description: 'Tag de versión (ej. 1.0.4 o prod)'
        required: true
        default: 'prod'
      branch_name:
        description: 'Rama de origen'
        required: true
        default: 'main'

env:
  GCP_PROJECT_ID: 'prj-hypertech-prod'
  ARTIFACT_REPO: 'docker-repo-asp-prod'
  GKE_CLUSTER_NAME: 'banking-cluster-asp-prod'
  GKE_ZONE: 'northamerica-south1'
  K8S_NAMESPACE: 'apps'

jobs:
  # ==========================================
  # STAGE 1: Git Download, Tag & Push
  # ==========================================
  stage_1_git_release:
    name: 'Stage 1: Git Release & Tagging'
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT }}
          fetch-depth: 0

      - name: Generar Cambio de Versión y Tag en Git
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "==> 1. Creando archivo de versión..."
          "RELEASE_TAG=${{ github.event.inputs.release_tag }}" | Out-File -FilePath version.txt -Encoding utf8

          Write-Host "==> 2. Configurando Git identity..."
          git config user.name "GitHub Actions Runner"
          git config user.email "runner@hypertech.local"

          Write-Host "==> 3. Realizando commit y push de Tag..."
          git add version.txt
          git commit -m "chore(release): bump ${{ github.event.inputs.service_name }} to ${{ github.event.inputs.release_tag }} [skip ci]"
          git tag -a "v${{ github.event.inputs.release_tag }}" -m "Release v${{ github.event.inputs.release_tag }} para Produccion"
          
          git push origin ${{ github.event.inputs.branch_name }} --tags
          Write-Host "[OK] Codigo etiquetado y publicado correctamente."

  # ==========================================
  # STAGE 2: Build & Push a Artifact Registry
  # ==========================================
  stage_2_build_and_push:
    name: 'Stage 2: Container Build & Push'
    needs: stage_1_git_release
    environment: Build-Approval
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Autenticación con GCP y Docker Config
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "==> 1. Autenticando con GCP Artifact Registry..."
          gcloud auth configure-docker northamerica-south1-docker.pkg.dev --quiet

      - name: Compilar y Subir Imagen Docker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ImageTag = "northamerica-south1-docker.pkg.dev/${env:GCP_PROJECT_ID}/${env:ARTIFACT_REPO}/${{ github.event.inputs.service_name }}:${{ github.event.inputs.release_tag }}"
          
          Write-Host "==> 2. Compilando imagen Docker: $ImageTag"
          docker build -t $ImageTag .

          Write-Host "==> 3. Subiendo imagen a Artifact Registry..."
          docker push $ImageTag
          Write-Host "[OK] Imagen subida exitosamente."

  # ==========================================
  # STAGE 3 & 4: Deploy a Kubernetes (GKE)
  # ==========================================
  stage_3_k8s_deploy:
    name: 'Stage 3 & 4: K8s Apply & Rollout Status'
    needs: stage_2_build_and_push
    environment: Production-Approval
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Obtener Credenciales de GKE y Aplicar Manifiestos
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ServiceName = "${{ github.event.inputs.service_name }}"
          $ReleaseTag = "${{ github.event.inputs.release_tag }}"
          $Namespace = "${env:K8S_NAMESPACE}"
          $FullImage = "northamerica-south1-docker.pkg.dev/${env:GCP_PROJECT_ID}/${env:ARTIFACT_REPO}/${ServiceName}:${ReleaseTag}"

          Write-Host "==> 1. Conectando al cluster GKE..."
          gcloud container clusters get-credentials ${env:GKE_CLUSTER_NAME} --zone ${env:GKE_ZONE} --project ${env:GCP_PROJECT_ID}

          Write-Host "==> 2. Aplicando ConfigMaps y Secrets (si existen)..."
          if (Test-Path "configmap.yaml") { kubectl apply -f configmap.yaml -n $Namespace }
          if (Test-Path "secret-${ServiceName}-prod.yaml") { kubectl apply -f "secret-${ServiceName}-prod.yaml" -n $Namespace }

          Write-Host "==> 3. Aplicando Deployment y Service..."
          $DeployFile = "${ServiceName}-deploy.yaml"
          $SvcFile = "${ServiceName}-svc.yaml"

          if (Test-Path $DeployFile) { kubectl apply -f $DeployFile -n $Namespace } else { kubectl apply -f deployment.yaml -n $Namespace }
          if (Test-Path $SvcFile) { kubectl apply -f $SvcFile -n $Namespace } elseif (Test-Path "service.yaml") { kubectl apply -f service.yaml -n $Namespace }

          Write-Host "==> 4. Actualizando la etiqueta de la imagen..."
          kubectl set image deployment/$ServiceName ${ServiceName}=${FullImage} -n $Namespace

          Write-Host "==> 5. Verificando estado del Rollout..."
          kubectl rollout status deployment/$ServiceName -n $Namespace --timeout=180s
          kubectl get pods -n $Namespace -l app=$ServiceName
          Write-Host "[OK] Despliegue completado con éxito."
