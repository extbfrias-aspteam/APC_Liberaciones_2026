name: Importar código de liberación (Jira)
on:
  repository_dispatch:
    types: [jira-liberacion]

permissions:
  contents: write

jobs:
  importar:
    runs-on: self-hosted   # necesario para GitLab interno / 172.17.x.x
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clonar origen y crear rama temporal
        env:
          REPO_URL: ${{ github.event.client_payload.repo_url }}
          SRC_BRANCH: ${{ github.event.client_payload.source_branch }}
          BRANCH: ${{ github.event.client_payload.branch }}
          ISSUE: ${{ github.event.client_payload.issue_key }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_SOURCE_TOKEN: ${{ secrets.GH_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          URL="${REPO_URL%/}"; URL="${URL%.git}.git"
          HOST=$(echo "$URL" | awk -F/ '{print $3}')
          if [[ "$HOST" == "github.com" ]]; then
            AUTH_URL="https://x-access-token:${GH_SOURCE_TOKEN}@${URL#https://}"
          else
            AUTH_URL="https://oauth2:${GITLAB_TOKEN}@${URL#https://}"
          fi
          # Certificado autofirmado cuando la liga es una IP
          if [[ "$HOST" =~ ^[0-9.]+$ ]]; then export GIT_SSL_NO_VERIFY=true; fi

          rm -rf /tmp/origen
          if [[ -n "$SRC_BRANCH" ]] && git ls-remote --exit-code --heads "$AUTH_URL" "$SRC_BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$SRC_BRANCH" "$AUTH_URL" /tmp/origen
          else
            echo "Rama '$SRC_BRANCH' no encontrada; usando rama por defecto"
            git clone --depth 1 "$AUTH_URL" /tmp/origen
          fi
          SRC_SHA=$(git -C /tmp/origen rev-parse --short HEAD)

          git checkout -b "$BRANCH"
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/origen/ ./
          git config user.name  "jira-automation"
          git config user.email "jira-automation@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "$ISSUE: importa código desde $REPO_URL ($SRC_SHA)"
          git push origin "$BRANCH"
          rm -rf /tmp/origen
