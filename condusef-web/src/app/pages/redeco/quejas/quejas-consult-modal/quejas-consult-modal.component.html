<div class="modal-header">
    <h4 class="modal-title">Consultar quejas</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body p-4">
    <div class="row">
        <div class="col-lg-12">
            <ul class="list-inline">
                <li class="list-inline-item">
                    Resumen de quejas que han sido registradas a traves del API REDECO
                </li>
            </ul>
            <h5 class="mb-3">{{quejas.length}} quejas encontradas</h5>
        </div>

        <div style="overflow-y:scroll; height: 400px;">
            <div class="table-responsive">
                <table class="table table-striped table-sm" style="border: 1px solid #DDDDDD">
                    <thead>
                        <tr>
                            <th scope="col">Institución</th>
                            <th scope="col">Folio</th>
                            <th scope="col">Mes</th>
                            <th scope="col">Año</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of quejas;let i = index">
                            <td>{{item.institucionClave}}</td>
                            <td><strong>{{item.folio}}</strong></td>
                            <td>{{item.month}}</td>
                            <td>{{item.year}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <ngx-ui-loader 
        [loaderId]="'loader-01'"
        [bgsType]="'square-jelly-box'" 
        [fgsType]="'square-jelly-box'"
        [hasProgressBar]="true"
        bgsColor="#ed5565"
        fgsColor="#ed5565"
        pbColor="#ed5565">
    </ngx-ui-loader>  
</div>
<div class="modal-footer">
    <button 
        type="button" 
        class="btn btn-white"
        (click)="activeModal.dismiss()">
        Cerrar
    </button>
</div>
